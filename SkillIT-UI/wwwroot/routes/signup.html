<div class="modal signup-modal flex justify-center items-center cursor-default">
    <button class="exit">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
    <form action="" method="post" class="cred-form flex flex-col justify-center bg-white shadow-2xl rounded-xl w-10/12 sm:w-[420px] p-6 py-3">
        <h1 class="font-bold text-2xl text-center">Skill-IT | Sign Up</h1>
        <!-- <img class="w-24 h-24 mt-3 mx-auto" src="assets/images/user-def.png" alt=""> -->
        <!-- <h3 class="font-bold text-center">User Signup</h3> -->
        <div class="user-signup pt-6">
            <div class="input-group mb-4 flex flex-col">
                <h4 class="text-lg font-md ">First Name</h4>
                <div class="input-wrapper rounded-md flex flex-row w-full h-9 border hover:shadow overflow-hidden"
                    style="border-radius: 5px;">
                    <label class="w-10 h-full flex justify-center items-center pl-1" for="firstname">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                        </svg>
                    </label>
                    <input class="w-full px-2 py-1" type="text" maxlength="15" name="firstname" id="firstname" placeholder="firstname"
                        title="First Name" autocapitalize="on" pattern="^[A-Z](?=.*[a-z]).{2,15}"/>
                </div>
            </div>
            <div class="input-group mb-4 flex flex-col">
                <h4 class="text-lg font-md ">Last Name</h4>
                <div class="input-wrapper rounded-md flex flex-row w-full h-9 border hover:shadow overflow-hidden"
                    style="border-radius: 5px;">
                    <label class="w-10 h-full flex justify-center items-center pl-1" for="lastname">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                        </svg>
                    </label>
                    <input class="w-full px-2 py-1" type="text" maxlength="15" name="lastname" id="lastname" placeholder="lastname"
                        title="Last Name" autocapitalize="on" pattern="^[A-Z](?=.*[a-z]).{2,15}"/>
                </div>
            </div>
            <div class="input-group mb-6 flex flex-col">
                <h4 class="text-lg font-md ">Email</h4>
                <div class="input-wrapper rounded-md flex flex-row w-full h-9 border hover:shadow overflow-hidden"
                    style="border-radius: 5px;">
                    <label class="w-10 h-full flex justify-center items-center pl-1" for="email">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" d="M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zm0 0c0 1.657 1.007 3 2.25 3S21 13.657 21 12a9 9 0 10-2.636 6.364M16.5 12V8.25" />
                        </svg>
                    </label>
                    <input class="w-full px-2 py-1" type="email" name="email" id="user_email" placeholder="email"
                        title="Email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"/>
                </div>
            </div>
            <div class="input-group mb-4 flex flex-col">
                <h4 class="text-lg font-md ">Phone</h4>
                <div class="input-wrapper items-center justify-center rounded-md flex flex-row w-full h-9 border hover:shadow overflow-hidden"
                    style="border-radius: 5px;">
                    <label class="w-10 h-8 flex justify-center items-center pl-1" for="phone">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                        </svg>
                    </label>
                    <input class="w-full px-2 py-1" type="tel" maxlength="9" name="phone" id="phone" placeholder="phone"
                        title="Phone" pattern="[0-9]{9}"/>
                </div>
            </div>
            <div class="input-group mb-4 flex flex-col">
                <h4 class="text-lg font-md ">Password</h4>
                <div class="password-wrapper flex flex-row gap-2">
                    <div class="input-wrapper rounded-md flex flex-row w-full h-9 border hover:shadow overflow-hidden"
                        style="border-radius: 5px;">
                        <label class="w-10 h-full flex toggleLock justify-center items-center pl-1" for="catName">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                        </label>
                        <input class="w-full px-2 py-1" type="password" name="Password" id="password" placeholder="password"
                            title="Password" maxlength="15" pattern="(?=.*\d)(?=.*[a-z]).{8,15}"/>
                    </div>
                    <div class="input-wrapper rounded-md flex flex-row w-full h-9 border hover:shadow overflow-hidden"
                        style="border-radius: 5px;">
                        <label class="w-10 h-full flex toggleLock justify-center items-center pl-1" for="catName">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                        </label>
                        <input class="w-full px-2 py-1" type="password" name="Password" id="cpassword" placeholder="re-enter password"
                            title="Password" maxlength="15" pattern="(?=.*\d)(?=.*[a-z]).{8,15}"/>
                    </div>
                </div>
            </div>
            <div class="input-group mt-6 flex justify-center">
                <button
                    class="signup-btn btn-large" role="button">Sign up</button>
            </div>
            <div class="input-group mt-4 flex justify-center">
                <span>Already have an account? <a class="text-blue-500 to-login hover:text-white hover:bg-blue-600 rounded px-1 cursor-pointer r-login">Login</a></span>
            </div>
        </div>
    </form>
</div>
<script>
    setEventHandlers()
    loader.addClass('hidden')
    chAuth()
    
    entryValidityCheck()
    //$('#password').get(0).setCustomValidity('Password must be 8 or more characters in length and have at least 1 number, special character and uppercase letter are optional')

    $('.signup-btn').click((e) => {
        loader.removeClass('hidden')
        let password = $('#password').val()
        let cpassword = $('#cpassword').val()
        e.preventDefault()
        if (password != cpassword) {
            popUpBox('error', 'No password match, please check again!', 'passAlert')
            console.log('No password match')
            loader.addClass('hidden')
            return
        }
        let this_user = new User(newUserId(), 'm', TrimSpace($('#firstname').val()), TrimSpace($('#lastname').val()), TrimSpace($('#user_email').val()), '', TrimSpace(cpassword), new Date(), 'Address', new Date(), $('#phone').val(), "")
        if (this_user.firstName == '' || this_user.lastName == '' || this_user.email == '' || this_user.password == '' || this_user.phone == '') {
            popUpBox('info', 'There are empty field(s), please check again!', 'formAlert')
            loader.addClass('hidden')
            return
        }
        let this_lgs = Array()
        let this_lgas = Array()
        if (userLocation === undefined) {
            this_lgs.push(new LoginInfo(`${newUserId()}`, `${newUserId()}`, new Date(), false, true, userIPAddress.ip))
        }
        else {
            this_lgs.push(new LoginInfo(userLocation.coords.longitude.toString(), userLocation.coords.latitude.toString(), new Date(), false, true, userIPAddress.ip))
        }
        this_lgas.push(new LoginAttemp(new Date(), 'Justified', 'success'))
        this_user.loginAttemps = this_lgas
        this_user.loginInfos = this_lgs
        checkEmail(this_user.email, () => {
            addUser(this_user, new File([], 'image', {type: 'png'}), () => {
                AuthenticateUser(new UserCredential(this_user.email, this_user.password, false, ''), () => {
                    loader.addClass('hidden')
                    //_ROUTER.navigate('/dashboard')
                    chAuth()
                    $('input').val('')
                    location.href = location.origin + "/dashboard"
                }, () => {
                    chAuth()
                    $('input').val('')
                })
            })
        })
        //addUser(this_user)
    })
</script>
